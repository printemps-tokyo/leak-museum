name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs on a fresh checkout, so an exhibit file that never made it into
      # git (a global .gitignore skipping .swp or .vscode/, say) fails here.
      - run: python3 scripts/check-museum.py
